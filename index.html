<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>312AS — 312th Airlift Squadron · v16</title>
<style>
  :root{
    --bg:#e4dbc2; --panel:#f2ebd8; --panel-2:#e9e0c6; --ink:#252a19; --muted:#6a684f;
    --line:#b8ac88; --od:#4a5230; --od-deep:#2b321e; --signal:#c2621d; --on-od:#efe7cf;
    --hero-text:#efe7cf; --hero-muted:#b7b38f; --shadow:0 1px 0 rgba(0,0,0,.04),0 10px 24px -16px rgba(43,50,30,.45);
    --head:"Bahnschrift","Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",ui-sans-serif,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#12160d; --panel:#1b2114; --panel-2:#232a19; --ink:#e9e0c5; --muted:#a09c7e;
      --line:#38422a; --od:#9aab68; --od-deep:#0d100a; --signal:#e3a33b; --on-od:#12160d;
      --hero-text:#ece3c8; --hero-muted:#a8a584; --shadow:0 12px 28px -18px rgba(0,0,0,.8);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;color:var(--ink);background:var(--bg);
    font:16px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom,0);
  }
  a{color:inherit}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  /* hero: olive field with grid and contour lines */
  .hero{
    position:relative;color:var(--hero-text);
    padding:calc(56px + env(safe-area-inset-top,0px)) 24px 52px;
    overflow:hidden;
    background-color:var(--od-deep);
    background-image:
      repeating-linear-gradient(0deg,rgba(217,207,168,.06) 0 1px,transparent 1px 56px),
      repeating-linear-gradient(90deg,rgba(217,207,168,.06) 0 1px,transparent 1px 56px);
    background-repeat:repeat,repeat;
    background-position:0 0,0 0;
  }
  .ifr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .ifr-page{position:fixed;inset:0;width:100%;height:100%;z-index:-1;--chart:#59613a;--chart-box:var(--bg)}
  @media (prefers-color-scheme:dark){.ifr-page{--chart:#c3bd92}}
  .ifr.ifr-page{opacity:.2}
  .hero .ifr{opacity:.55}
  .hero-fade{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,color-mix(in srgb,var(--od-deep) 92%,transparent) 0%,color-mix(in srgb,var(--od-deep) 55%,transparent) 38%,transparent 70%);
  }
  .hero::after{ /* sand and olive stripe along the bottom edge */
    content:"";z-index:3;position:absolute;left:0;right:0;bottom:0;height:8px;
    background:repeating-linear-gradient(-45deg,#c9b98a 0 14px,#4a5230 14px 28px);
  }
  .hero-in{position:relative;z-index:2;max-width:1320px;margin:0 auto;padding:30px 0 6px}
  .hero-in::before,.hero-in::after{ /* corner brackets */
    content:"";position:absolute;width:26px;height:26px;border:2px solid var(--signal);opacity:.9;
  }
  .hero-in::before{top:0;left:0;border-right:0;border-bottom:0}
  .hero-in::after{right:0;bottom:0;border-left:0;border-top:0}
  .hero h1{
    margin:0;padding:0 14px;font-family:var(--head);font-stretch:condensed;font-weight:800;
    font-size:clamp(54px,12vw,120px);line-height:.92;letter-spacing:.02em;text-transform:uppercase;
  }
  .hero h1 small{
    display:block;margin-top:16px;font-family:var(--head);font-stretch:condensed;font-weight:500;
    font-size:clamp(16px,2.4vw,22px);letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted);line-height:1.3;
  }

  /* sections: side-by-side columns, each a card with a vertical list of links */
  main{max-width:1320px;margin:0 auto;padding:36px 24px 72px}
  .stack{
    display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;
    gap:20px;counter-reset:sec;
  }
  .card{
    position:relative;counter-increment:sec;background:var(--panel);
    flex:0 0 calc((100% - 40px) / 3);min-width:0;
    border:1.5px solid var(--line);border-top:4px solid var(--od);box-shadow:var(--shadow);
  }
  .card::after{ /* notched corner */
    content:"";position:absolute;top:-4px;right:-1.5px;width:0;height:0;z-index:1;
    border-top:22px solid var(--bg);border-left:22px solid transparent;
  }
  .card-h{
    display:flex;align-items:center;gap:12px;padding:12px 30px 12px 16px;
    background:var(--panel-2);border-bottom:1.5px solid var(--line);
  }
  .ico{font-size:20px;line-height:1}
  .card h2{
    margin:0;font-family:var(--head);font-stretch:condensed;font-weight:700;font-size:19px;
    letter-spacing:.1em;text-transform:uppercase;
  }
  .card h2::before{
    content:counter(sec,decimal-leading-zero);margin-right:10px;font:600 12px var(--mono);
    letter-spacing:.06em;color:var(--signal);vertical-align:3px;
  }
  .count{margin-left:auto;font:600 12px var(--mono);color:var(--muted)}
  .tiles{padding:6px 0}
  .tile{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 16px 9px 13px;border-left:3px solid transparent;border-bottom:1px solid var(--line);
    text-decoration:none;font-size:14.5px;line-height:1.35;
    transition:background .15s,color .15s,border-color .15s;
  }
  .tile:last-child{border-bottom:0}
  .tile:hover,.tile:focus-visible{background:var(--od);color:var(--on-od);border-left-color:var(--signal)}
  .tile svg{flex:none;color:var(--signal);opacity:0;transition:opacity .15s}
  .tile:hover svg,.tile:focus-visible svg{opacity:1}
  #uta,#morale{flex:1 1 100%}

  /* UTA weekends */
  /* expandable UTA header */
  .uta-toggle{width:100%;margin:0;border:0;border-bottom:1.5px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
  .uta-toggle[aria-expanded="false"]{border-bottom-color:transparent}
  .uta-toggle:hover{background:var(--od);color:var(--on-od)}
  .uta-toggle:hover .hint{color:var(--on-od)}
  .hint{margin-left:auto;font:600 12.5px var(--mono);color:var(--muted)}
  .tip{
    margin-left:12px;padding:3px 10px;border:1px solid var(--signal);color:var(--signal);
    font:600 11.5px var(--head);font-stretch:condensed;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
    transition:background .15s,color .15s;
  }
  .uta-toggle:hover .tip{background:var(--signal);color:#fff}
  .chev{display:grid;place-items:center;margin-left:10px;color:var(--signal);transition:transform .2s}
  .uta-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .uta-wrap[hidden]{display:none}
  .uta-wrap{overflow-x:auto;padding:8px 12px 10px}
  .uta{width:100%;border-collapse:collapse;font-size:15px}
  .uta th{
    text-align:left;padding:10px 14px;font:600 12.5px var(--head);font-stretch:condensed;letter-spacing:.14em;
    text-transform:uppercase;color:var(--on-od);background:var(--od);
  }
  .uta td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  .uta tbody tr:nth-child(even) td{background:rgba(120,110,70,.07)}
  .uta tr:last-child td{border-bottom:0}
  .uta .m{font-weight:650}
  .uta td:nth-child(2){font-family:var(--mono);font-size:14.5px}
  .uta tr.past td{color:var(--muted)}
  .uta tr.next td{background:rgba(194,98,29,.16);box-shadow:inset 0 1px 0 var(--signal),inset 0 -1px 0 var(--signal)}
  .uta tr.next td:first-child{box-shadow:inset 4px 0 0 var(--signal),inset 0 1px 0 var(--signal),inset 0 -1px 0 var(--signal)}
  .badge{
    display:inline-block;margin-left:10px;padding:2px 9px;background:var(--signal);color:#fff;
    font:700 11.5px var(--head);font-stretch:condensed;letter-spacing:.14em;text-transform:uppercase;vertical-align:2px;
  }
  .addcal{
    display:inline-block;padding:8px 13px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    font-size:13.5px;font-weight:600;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;
  }
  .addcal:hover{background:var(--od);color:var(--on-od);border-color:var(--od)}

  .uta td:last-child,.uta th:last-child{text-align:right}
  .uta-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:16px 14px 6px}
  .uta-help{font-size:13px;color:var(--muted)}
  #morale-panel .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 14px;padding:8px 12px}
  .ver{display:inline-block;margin-top:14px;padding:3px 11px;border:1px solid var(--line);font:600 12px var(--mono);color:var(--muted)}
  footer{
    max-width:1320px;margin:0 auto;padding:0 24px calc(48px + env(safe-area-inset-bottom,0px));
    color:var(--muted);font-size:14px;
  }
  .foot-in{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:18px 16px;border-top:1.5px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent)}
  .mails{display:flex;flex-wrap:wrap;gap:10px 22px}
  footer a{color:var(--signal);text-decoration:none;font:600 14px var(--mono)}
  footer a:hover{text-decoration:underline}

  @media (max-width:980px){
    .card{flex-basis:calc((100% - 20px) / 2)}
  }
  @media (max-width:720px){
    .hero .ifr{opacity:.4}
    .uta-toggle .hint{display:none}
    .uta-toggle .tip{margin-left:auto}
    .hero{padding:calc(36px + env(safe-area-inset-top,0px)) 18px 44px}
    .hero-in{padding-top:24px}
    main{padding:26px 14px 56px}
    .card{flex-basis:100%}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function dayAt(iso){ return new Date(iso + "T12:00:00"); }
function range(a, b){
  const da = dayAt(a), db = dayAt(b);
  return da.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + "\u2013" +
         db.toLocaleDateString("en-US",{day:"numeric"});
}
function gcal(title, start, end){
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(title) +
         "&dates=" + ymd(start, 0) + "/" + ymd(end, 1) +      // end date is exclusive
         "&details=349th+AMW+UTA+Weekend&location=Travis+AFB,+CA";
}

  const year = u.primary[0].slice(0,4);

  tr.append(c1, c2, c3); utaBody.appendChild(tr);
});

/* one .ics file with every UTA weekend (imports into Google Calendar, Apple Calendar, Outlook) */
function ymd(iso, plus){
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d + plus)).toISOString().slice(0, 10).replace(/-/g, "");
}
function buildICS(){
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//312AS//UTA Weekends//EN", "CALSCALE:GREGORIAN",
             "X-WR-CALNAME:349th UTA Weekends 2026-2027"];
  UTA.forEach(u => {
    L.push("BEGIN:VEVENT",
      "UID:uta-" + ymd(u.primary[0], 0) + "@312as.org",
      "DTSTAMP:" + stamp,
      "DTSTART;VALUE=DATE:" + ymd(u.primary[0], 0),
      "DTEND;VALUE=DATE:" + ymd(u.primary[1], 1),        // end date is exclusive
      "SUMMARY:349 AMW UTA \u2013 " + u.month,
      "LOCATION:Travis AFB\\, CA",
      "DESCRIPTION:349th AMW UTA weekend",
      "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n") + "\r\n";
}
uta.querySelector("#ics-link").href =
  URL.createObjectURL(new Blob([buildICS()], { type: "text/calendar;charset=utf-8" }));

/* shared expand / collapse for the UTA and Morale cards */
function wireExpander(card){
  const btn = card.querySelector(".uta-toggle"), panel = btn.nextElementSibling, tip = card.querySelector(".tip");
  btn.addEventListener("click", () => {
    const open = btn.getAttribute("aria-expanded") === "true";
    btn.setAttribute("aria-expanded", String(!open));
    tip.textContent = open ? "Click to expand" : "Click to collapse";
    panel.hidden = open;
  });
}
