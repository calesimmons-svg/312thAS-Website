<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>312AS — 312th Airlift Squadron · v84</title>
<style>
  :root{
    --bg:#e4dbc2; --panel:#f2ebd8; --panel-2:#e9e0c6; --ink:#252a19; --muted:#6a684f;
    --line:#b8ac88; --od:#4a5230; --od-deep:#2b321e; --signal:#c2621d; --on-od:#efe7cf;
    --hero-text:#efe7cf; --hero-muted:#b7b38f; --shadow:0 1px 0 rgba(0,0,0,.04),0 10px 24px -16px rgba(43,50,30,.45);
    --head:"Bahnschrift","Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",ui-sans-serif,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#12160d; --panel:#1b2114; --panel-2:#232a19; --ink:#e9e0c5; --muted:#a09c7e;
      --line:#38422a; --od:#9aab68; --od-deep:#0d100a; --signal:#e3a33b; --on-od:#12160d;
      --hero-text:#ece3c8; --hero-muted:#a8a584; --shadow:0 12px 28px -18px rgba(0,0,0,.8);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;color:var(--ink);background:var(--bg);
    font:16px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom,0);
  }
  a{color:inherit}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  /* hero: olive field with grid and contour lines */
  .hero{
    position:relative;color:var(--hero-text);
    padding:calc(56px + env(safe-area-inset-top,0px)) 24px 52px;
    overflow:hidden;
    background-color:var(--od-deep);
    background-image:
      repeating-linear-gradient(0deg,rgba(217,207,168,.06) 0 1px,transparent 1px 56px),
      repeating-linear-gradient(90deg,rgba(217,207,168,.06) 0 1px,transparent 1px 56px);
    background-repeat:repeat,repeat;
    background-position:0 0,0 0;
  }
  .ifr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .ifr-page{position:fixed;inset:0;width:100%;height:100%;z-index:-1;--chart:#59613a;--chart-box:var(--bg)}
  @media (prefers-color-scheme:dark){.ifr-page{--chart:#c3bd92}}
  .ifr.ifr-page{opacity:.2}
  .hero .ifr{opacity:.55}
  .hero-fade{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,color-mix(in srgb,var(--od-deep) 92%,transparent) 0%,color-mix(in srgb,var(--od-deep) 55%,transparent) 38%,transparent 70%);
  }
  .hero::after{ /* sand and olive stripe along the bottom edge */
    content:"";z-index:3;position:absolute;left:0;right:0;bottom:0;height:8px;
    background:repeating-linear-gradient(-45deg,#c9b98a 0 14px,#4a5230 14px 28px);
  }
  .hero-in{position:relative;z-index:2;max-width:1320px;margin:0 auto;padding:30px 0 6px}
  .hero-in::before,.hero-in::after{ /* corner brackets */
    content:"";position:absolute;width:26px;height:26px;border:2px solid var(--signal);opacity:.9;
  }
  .hero-in::before{top:0;left:0;border-right:0;border-bottom:0}
  .hero-in::after{right:0;bottom:0;border-left:0;border-top:0}
  .hero h1{
    margin:0;padding:0 14px;font-family:var(--head);font-stretch:condensed;font-weight:800;
    font-size:clamp(54px,12vw,120px);line-height:.92;letter-spacing:.02em;text-transform:uppercase;
  }
  .hero h1 small{
    display:block;margin-top:16px;font-family:var(--head);font-stretch:condensed;font-weight:500;
    font-size:clamp(16px,2.4vw,22px);letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted);line-height:1.3;
  }

  /* sections: side-by-side columns, each a card with a vertical list of links */
  main{max-width:1320px;margin:0 auto;padding:36px 24px 72px}
  .stack{
    display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;
    gap:20px;counter-reset:sec;
  }
  .card{
    position:relative;counter-increment:sec;background:var(--panel);
    flex:0 0 calc((100% - 40px) / 3);min-width:0;
    border:1.5px solid var(--line);border-top:4px solid var(--od);box-shadow:var(--shadow);
  }
  .card::after{ /* notched corner */
    content:"";position:absolute;top:-4px;right:-1.5px;width:0;height:0;z-index:1;
    border-top:22px solid var(--bg);border-left:22px solid transparent;
  }
  .card-h{
    display:flex;align-items:center;gap:12px;padding:12px 30px 12px 16px;
    background:var(--panel-2);border-bottom:1.5px solid var(--line);
  }
  .ico{font-size:20px;line-height:1}
  .card h2{
    margin:0;font-family:var(--head);font-stretch:condensed;font-weight:700;font-size:19px;
    letter-spacing:.1em;text-transform:uppercase;
  }
  .card h2::before{
    content:counter(sec,decimal-leading-zero);margin-right:10px;font:600 12px var(--mono);
    letter-spacing:.06em;color:var(--signal);vertical-align:3px;
  }
  .count{margin-left:auto;font:600 12px var(--mono);color:var(--muted)}
  .tiles{padding:6px 0}
  .tile{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 16px 9px 13px;border-left:3px solid transparent;border-bottom:1px solid var(--line);
    text-decoration:none;font-size:14.5px;line-height:1.35;
    transition:background .15s,color .15s,border-color .15s;
  }
  .tile:last-child{border-bottom:0}
  .tile:hover,.tile:focus-visible{background:var(--od);color:var(--on-od);border-left-color:var(--signal)}
  .tile.tbd{cursor:default;color:var(--muted)}
  .tile.tbd:hover{background:transparent;color:var(--muted);border-left-color:transparent}
  .tile .tbd-note{flex:none;font:700 11px var(--mono);letter-spacing:.08em;color:var(--signal)}
  .tile svg{flex:none;color:var(--signal);opacity:0;transition:opacity .15s}
  .tile:hover svg,.tile:focus-visible svg{opacity:1}
  #uta,#morale{flex:1 1 100%}

  /* UTA weekends */
  /* expandable UTA header */
  .uta-toggle{width:100%;margin:0;border:0;border-bottom:1.5px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
  .uta-toggle[aria-expanded="false"]{border-bottom-color:transparent}
  .uta-toggle:hover{background:var(--od);color:var(--on-od)}
  .uta-toggle:hover .hint{color:var(--on-od)}
  .hint{margin-left:auto;font:600 12.5px var(--mono);color:var(--muted)}
  .tip{
    margin-left:12px;padding:3px 10px;border:1px solid var(--signal);color:var(--signal);
    font:600 11.5px var(--head);font-stretch:condensed;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
    transition:background .15s,color .15s;
  }
  .uta-toggle:hover .tip{background:var(--signal);color:#fff}
  .chev{display:grid;place-items:center;margin-left:10px;color:var(--signal);transition:transform .2s}
  .uta-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .uta-wrap[hidden]{display:none}
  .uta-wrap{overflow-x:auto;padding:8px 12px 10px}
  .uta{width:100%;border-collapse:collapse;font-size:15px}
  .uta th{
    text-align:left;padding:10px 14px;font:600 12.5px var(--head);font-stretch:condensed;letter-spacing:.14em;
    text-transform:uppercase;color:var(--on-od);background:var(--od);
  }
  .uta td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  .uta tbody tr:nth-child(even) td{background:rgba(120,110,70,.07)}
  .uta tr:last-child td{border-bottom:0}
  .uta .m{font-weight:650}
  .uta td:nth-child(2){font-family:var(--mono);font-size:14.5px}
  .uta tr.past td{color:var(--muted)}
  .uta tr.next td{background:rgba(194,98,29,.16);box-shadow:inset 0 1px 0 var(--signal),inset 0 -1px 0 var(--signal)}
  .uta tr.next td:first-child{box-shadow:inset 4px 0 0 var(--signal),inset 0 1px 0 var(--signal),inset 0 -1px 0 var(--signal)}
  .badge{
    display:inline-block;margin-left:10px;padding:2px 9px;background:var(--signal);color:#fff;
    font:700 11.5px var(--head);font-stretch:condensed;letter-spacing:.14em;text-transform:uppercase;vertical-align:2px;
  }
  .addcal{
    display:inline-block;padding:8px 13px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    font-size:13.5px;font-weight:600;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;
  }
  .addcal:hover{background:var(--od);color:var(--on-od);border-color:var(--od)}

  .uta td:last-child,.uta th:last-child{text-align:right}
  .uta-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:16px 14px 6px}
  .uta-help{font-size:13px;color:var(--muted)}
  #morale-panel .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 14px;padding:8px 12px}
  .ver{display:inline-block;margin-top:14px;padding:3px 11px;border:1px solid var(--line);font:600 12px var(--mono);color:var(--muted)}
  footer{
    max-width:1320px;margin:0 auto;padding:0 24px calc(48px + env(safe-area-inset-bottom,0px));
    color:var(--muted);font-size:14px;
  }
  .foot-in{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:18px 16px;border-top:1.5px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent)}
  .mails{display:flex;flex-wrap:wrap;gap:10px 22px}
  footer a{color:var(--signal);text-decoration:none;font:600 14px var(--mono)}
  footer a:hover{text-decoration:underline}


  /* idle soldier */
  .sol{position:fixed;left:0;top:0;width:64px;height:112px;z-index:100;pointer-events:none;display:none;will-change:transform}
  .sol svg{width:100%;height:100%;overflow:visible;display:block}
  .sol canvas.gore,#rocks .rock canvas.gore{position:absolute;left:0;top:0;pointer-events:none}
  .sol.flip canvas.gore{transform:scaleX(-1)}
  .sol.crouch canvas.gore{transform-origin:50% 100%;transform:scaleY(.62)}
  .sol.flip.crouch canvas.gore{transform:scaleX(-1) scaleY(.62)}
  .spk{position:fixed;left:0;top:0;width:46px;height:32px;will-change:transform}
  .spk svg{width:46px;height:32px}
  .spk .pb{fill:#555}
  .spk.on .pb{fill:#4ade80}
  .spk.on svg{animation:spkP .36s ease-in-out infinite}
  @keyframes spkP{50%{transform:scale(1.1)}}
  .spk.on.hi svg{animation:spkP2 .17s ease-in-out infinite}
  @keyframes spkP2{50%{transform:scale(1.28)}}
  .note{position:fixed;font-size:19px;line-height:1;pointer-events:none;animation:noteA 2.3s ease-out forwards}
  @keyframes noteA{0%{opacity:0;translate:0 0;scale:.6}15%{opacity:1}100%{opacity:0;translate:var(--nx,10px) -95px;scale:1.25}}
  .cap{position:fixed;padding:3px 9px;border-radius:4px;background:rgba(0,0,0,.78);color:#ffe27a;font:700 12px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;white-space:nowrap;transform:translateX(-50%);animation:capA 6s ease-out forwards}
  @keyframes capA{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
  .sol.flip svg{transform:scaleX(-1)}
  .sol .bub{
    position:absolute;bottom:100%;left:50%;margin-bottom:6px;width:max-content;max-width:190px;
    padding:6px 10px;background:var(--panel);color:var(--ink);border:1.5px solid var(--od);box-shadow:var(--shadow);
    font:600 12px/1.3 var(--mono);opacity:0;transform:translate(-50%,4px);transition:opacity .25s,transform .25s;
  }
  .sol.talk .bub{opacity:1;transform:translate(-50%,0)}
  .sol.flip .bub{transform:translate(-50%,4px)}
  .sol.flip.talk .bub{transform:translate(-50%,0)}
  .sl-leg-f,.sl-leg-b{transform-origin:40px 80px}
  .sl-arm-f,.sl-arm-b{transform-origin:40px 44px}
  .sl-fore-f{transform-origin:40px 60px;transform:rotate(-18deg)}
  .sl-fore-b{transform-origin:40px 60px;transform:rotate(-12deg)}
  .sl-all{transform-origin:40px 140px}
  .sol.walk .sl-leg-f,.sol.walk .sl-arm-b{animation:slSwing .7s ease-in-out infinite}
  .sol.walk .sl-leg-b,.sol.walk .sl-arm-f{animation:slSwing .7s ease-in-out -.35s infinite}
  .sol.walk .sl-all{animation:slBob .35s ease-in-out infinite}
  .sol.run .sl-leg-f,.sol.run .sl-arm-b{animation-duration:.4s}
  .sol.run .sl-leg-b,.sol.run .sl-arm-f{animation-duration:.4s;animation-delay:-.2s}
  .sol.run .sl-all{animation-duration:.2s}
  .sol .sl-arm-f,.sol .sl-fore-f{transition:transform .35s ease}
  .sol.salute .sl-arm-f{transform:rotate(-110deg)}
  .sol.salute .sl-fore-f{transform:rotate(-90deg)}
  .sol.idle .sl-all{animation:slBreathe 2.4s ease-in-out infinite}
  @keyframes slSwing{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}
  @keyframes slBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes slBreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}


  /* two soldiers */
  .skin{fill:var(--skin,#d9aa84)} .skin2{fill:var(--skin2,#c99a76)}
  .sol.b{--skin:#93603f;--skin2:#7f5133}
  .sol.b svg{filter:hue-rotate(-14deg) brightness(1.12) saturate(.9)}
  .sl-all{transition:transform .25s ease}
  .sol.crouch .sl-all{animation:none!important;transform:scaleY(.62)}
  .sol.crouch .bub{margin-bottom:-38px}
  #rocks{position:fixed;inset:0;z-index:101;pointer-events:none;overflow:hidden}
  #rocks .rock{position:fixed;left:0;top:0;width:150px;height:60px}
  #rocks .rock svg{display:block;width:100%;height:100%}
  #decals{position:fixed;inset:0;width:100%;height:100%;z-index:98;pointer-events:none}
  #scene .nuke{position:fixed;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffe27a 24%,#ff7a1a 55%,rgba(255,60,0,0) 72%);animation:nukeA .85s ease-out forwards}
  @keyframes nukeA{from{scale:.2;opacity:1}to{scale:6;opacity:0}}
  #scene .shock{position:fixed;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;border:4px solid rgba(255,255,255,.65);animation:shockA .9s ease-out forwards}
  @keyframes shockA{from{scale:.3;opacity:.9}to{scale:11;opacity:0}}
  #scene .dust{position:fixed;width:46px;height:30px;margin:-15px 0 0 -23px;border-radius:50%;background:radial-gradient(circle,rgba(150,120,80,.85),rgba(150,120,80,0) 70%);animation:dustA 1.6s ease-out forwards}
  @keyframes dustA{from{scale:.3;opacity:.9}to{scale:6;opacity:0;translate:0 -30px}}
  #scene .knife{position:fixed;margin:-4px 0 0 0;transform-origin:0 50%;animation:knifeA .3s ease-in-out forwards}
  @keyframes knifeA{from{rotate:calc(var(--s) * -80deg);opacity:1}80%{rotate:calc(var(--s) * 50deg);opacity:1}to{rotate:calc(var(--s) * 60deg);opacity:0}}
  #scene .mag{position:fixed;width:5px;height:13px;margin:-6px 0 0 -2px;background:#2d2f2a;border-radius:1px;animation:magA .6s ease-in forwards}
  @keyframes magA{to{translate:8px 52px;rotate:170deg;opacity:0}}
  #scene .gren{position:fixed;left:0;top:0}
  .gnuke{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffe27a 28%,#ff7a1a 58%,rgba(255,60,0,0) 74%);animation:gnukeA .6s ease-out forwards}
  @keyframes gnukeA{from{scale:.3;opacity:1}to{scale:5;opacity:0}}
  .gshock{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid rgba(255,255,255,.6);animation:gshockA .7s ease-out forwards}
  @keyframes gshockA{from{scale:.3;opacity:.9}to{scale:7;opacity:0}}
  /* A-10 strafing run */
  #scene .trc,#scene .hole,#scene .puff,#scene .spark{position:fixed;left:0;top:0}
  #scene .trc{width:24px;height:3px;margin:-1.5px 0 0 -24px;transform-origin:100% 50%;border-radius:2px;
    background:linear-gradient(90deg,rgba(255,170,40,0),#ffc94d 55%,#fffbe0);box-shadow:0 0 4px rgba(255,190,60,.8)}
  #scene .hole{width:11px;height:5px;margin:-2.5px 0 0 -5.5px;border-radius:50%;
    background:radial-gradient(ellipse,#2a2014 38%,rgba(110,92,62,.55) 68%,transparent 76%);animation:holeFade 6s forwards}
  #scene .puff{width:26px;height:16px;margin:-10px 0 0 -13px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(150,128,90,.85),rgba(150,128,90,0) 70%);animation:puff .55s ease-out forwards}
  #scene .spark span{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffd36a;box-shadow:0 0 4px #ffb43a;animation:spk .35s ease-out forwards}
  #scene .spark span:nth-child(2){animation-name:spk2}
  #scene .flash{transform-origin:121px 28px;animation:flash .07s linear infinite alternate}
  @keyframes holeFade{0%,65%{opacity:1}100%{opacity:0}}
  @keyframes puff{from{scale:.3;opacity:.9}to{scale:1.7;opacity:0;translate:0 -6px}}
  @keyframes spk{to{translate:-9px -14px;opacity:0}} @keyframes spk2{to{translate:8px -10px;opacity:0}}
  @keyframes flash{from{transform:scaleX(.35)}to{transform:scaleX(1)}}
  html.nocur,html.nocur *{cursor:none !important}
  .zyn{display:none}
  .sol[data-zyn] .zyn{display:inline}
  .moabfl{position:fixed;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff6c8 20%,#ffb840 44%,rgba(230,90,20,.0) 72%);animation:moabfA 1.4s ease-out forwards}
  @keyframes moabfA{from{scale:.2;opacity:1}to{scale:14;opacity:0}}
  .mwave{position:fixed;width:100px;height:100px;margin:-50px 0 0 -50px;animation:mwaveA 1.6s ease-out forwards}
  .mwave svg{display:block;overflow:visible}
  .mwave circle{fill:none;stroke:rgba(255,248,226,.95);stroke-width:9;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 8px rgba(255,170,60,.95))}
  .mwave.thin circle{stroke-width:4;stroke:rgba(255,190,90,.9)}
  @keyframes mwaveA{from{scale:.05;opacity:1}75%{opacity:.9}to{scale:34;opacity:0}}
  .mflash{position:fixed;inset:0;z-index:140;background:#fff;pointer-events:none;animation:mflashA .9s ease-out forwards}
  @keyframes mflashA{0%{opacity:0}8%{opacity:1}22%{opacity:1}100%{opacity:0}}
  .mwave.fat circle{stroke-width:30;stroke:rgba(255,236,190,.9)}
  .mwave.glow circle{stroke-width:0;fill:rgba(255,205,120,.35);filter:none}
  /* blood */
  .cr .st{display:none}
  .cr.nohead .st{display:inline}
  .cr.nohead .hd{display:none}
  .cr.dead .cf{transform-origin:50% 100%;animation:crFall .45s ease-in forwards}
  .cr.dead.dl .cf{--rot:-84deg}
  .cr.dead.dr .cf{--rot:84deg}
  @keyframes crFall{to{transform:rotate(var(--rot,84deg)) translateY(4px)}}
  .cr.dead{animation:crGone 1s linear 8s forwards}
  @keyframes crGone{to{opacity:0}}
  #scene .blood,#scene .drop{position:fixed;left:0;top:0}
  #scene .blood{width:84px;height:17px;margin:-8px 0 0 -42px;border-radius:50%;
    background:radial-gradient(ellipse,#7c0d0d 40%,#5a0808 62%,rgba(70,8,8,0) 74%);
    animation:pool 3.2s ease-out forwards,poolFade 2.5s linear 8.5s forwards}
  #scene .drop{width:4px;height:4px;margin:-2px;border-radius:50%;background:#a01212;animation:dropFly .6s ease-out forwards}
  #scene .splat{position:fixed;left:0;top:0;border-radius:50%;background:#7c0d0d;animation:poolFade 2.5s linear 8s forwards}
  #talk{position:fixed;inset:0;z-index:150;pointer-events:none;overflow:hidden}
  #talk .bub{position:absolute;left:0;top:0;width:max-content;max-width:190px;padding:6px 10px;background:var(--panel);color:var(--ink);border:1.5px solid var(--od);box-shadow:var(--shadow);font:600 12px/1.3 var(--mono);opacity:0;transition:opacity .25s}
  #talk .bub.on{opacity:1}
  #talk .cbub{position:absolute;left:0;top:0;padding:4px 8px;white-space:nowrap;
    font:700 12px/1.2 var(--mono);color:#ffe08a;background:#2b210f;border:1.5px solid #b8922f;box-shadow:var(--shadow)}
  @keyframes pool{from{scale:.15 .15}to{scale:1 1}}
  @keyframes poolFade{to{opacity:0}}
  @keyframes dropFly{0%{translate:0 0;opacity:1}55%{translate:calc(var(--dx)*.7) var(--dy)}100%{translate:var(--dx) 6px;opacity:0}}
  #scene .gib{position:fixed;left:0;top:0;animation:gibFly .95s forwards,poolFade 2.5s linear 8.5s forwards}
  #scene .gib svg{display:block}
  @keyframes gibFly{
    0%{translate:0 0;rotate:0deg;animation-timing-function:cubic-bezier(.2,.8,.4,1)}
    42%{translate:calc(var(--dx)*.55) var(--up);animation-timing-function:cubic-bezier(.6,0,.9,.6)}
    100%{translate:var(--dx) var(--fall);rotate:var(--rot)}}
  #scene .mist{position:fixed;left:0;top:0;width:36px;height:24px;margin:-12px 0 0 -18px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(170,20,20,.9),rgba(170,20,20,0) 70%);animation:puff .5s ease-out forwards}
  .ff.jolt{animation:jolt .3s ease-out}
  @keyframes jolt{0%{translate:0 0}25%{translate:3px -4px}55%{translate:-3px 1px}100%{translate:0 0}}
  /* soldier: radio + desert-creature skit */
  .sol .radio-g{opacity:0}
  .sol.radio .radio-g{opacity:1}
  .sol.radio .sl-arm-f{transform:rotate(-110deg)}
  .sol.radio .sl-fore-f{transform:rotate(-90deg)}
  .sol.below .bub{bottom:auto;top:100%;margin:6px 0 0}
  .sol.shake svg{animation:slShake .45s linear 2}
  @keyframes slShake{0%,100%{translate:0 0}20%{translate:-3px 1px}40%{translate:3px -1px}60%{translate:-2px 0}80%{translate:2px 1px}}
  #scene{position:fixed;inset:0;z-index:99;pointer-events:none;overflow:hidden}
  #scene .cr,#scene .plane,#scene .bomb,#scene .boom{position:fixed;left:0;top:0;will-change:transform}
  #scene .cr{width:30px;height:36px}
  #scene .cr svg,#scene .plane svg{display:block;overflow:visible}
  .cf{width:100%;height:100%}
  .ff.flip{transform:scaleX(-1)}
  .cr.walk .cf{animation:crHop .5s ease-in-out infinite}
  .cr.rush .cf{animation:crHop .22s ease-in-out infinite}
  .cr.chat .cf{animation:crChat .3s linear infinite}
  @keyframes crHop{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
  @keyframes crChat{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-1.5px) rotate(-4deg)}75%{transform:translateX(1.5px) rotate(4deg)}}
  @keyframes crFly{to{transform:translateY(-70px) rotate(260deg) scale(.6);opacity:0}}
  #scene .bomb{width:8px;height:18px}
  #scene .boom{width:70px;height:70px;border-radius:50%;margin:-35px 0 0 -35px;
    background:radial-gradient(circle,#fffbd0 0,#ffc247 30%,#e2631a 55%,rgba(120,40,10,.55) 72%,transparent 74%);
    animation:boom .6s ease-out forwards}
  #scene .dust{position:fixed;left:0;top:0;width:90px;height:60px;margin:-40px 0 0 -45px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(90,76,52,.7),rgba(90,76,52,0) 70%);animation:dust 1.1s ease-out forwards}
  @keyframes boom{0%{scale:.2;opacity:1}60%{scale:1.5;opacity:1}100%{scale:1.9;opacity:0}}
  @keyframes dust{0%{scale:.3;opacity:.9}100%{scale:1.8;opacity:0;translate:0 -14px}}
  .pbub{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;padding:6px 12px;
    background:var(--panel);color:var(--ink);border:1.5px solid var(--od);box-shadow:var(--shadow);
    font:700 14px/1.2 var(--mono);white-space:nowrap}

  @media (max-width:980px){
    .card{flex-basis:calc((100% - 20px) / 2)}
  }
  @media (max-width:720px){
    .hero .ifr{opacity:.4}
    .uta-toggle .hint{display:none}
    .uta-toggle .tip{margin-left:auto}
    .hero{padding:calc(36px + env(safe-area-inset-top,0px)) 18px 44px}
    .hero-in{padding-top:24px}
    main{padding:26px 14px 56px}
    .card{flex-basis:100%}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* one .ics file with every UTA weekend (imports into Google Calendar, Apple Calendar, Outlook) */
function ymd(iso, plus){
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d + plus)).toISOString().slice(0, 10).replace(/-/g, "");
}
function buildICS(){
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//312AS//UTA Weekends//EN", "CALSCALE:GREGORIAN",
             "X-WR-CALNAME:349th UTA Weekends 2026-2027"];
  UTA.forEach(u => {
    L.push("BEGIN:VEVENT",
      "UID:uta-" + ymd(u.primary[0], 0) + "@312as.org",
      "DTSTAMP:" + stamp,
      "DTSTART;VALUE=DATE:" + ymd(u.primary[0], 0),
      "DTEND;VALUE=DATE:" + ymd(u.primary[1], 1),        // end date is exclusive
      "SUMMARY:349 AMW UTA \u2013 " + u.month,
      "LOCATION:Travis AFB\\, CA",
      "DESCRIPTION:349th AMW UTA weekend",
      "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n") + "\r\n";
}
uta.querySelector("#ics-link").href =
  URL.createObjectURL(new Blob([buildICS()], { type: "text/calendar;charset=utf-8" }));

    function callBomb(){

    /* three A-10s fly straight lines (any direction) near-tangent to the ring; guns fire dead ahead only */
    const RANGE = 230;
    let passes = 0; const lp = [0, 0, 0];
    (function rl(){ if (mine !== token || done) return; refresh(); requestAnimationFrame(rl); })();
    function runPass(lane){
      if (mine !== token || finished) { done = true; return; }

      if (lp.every(n => n >= 4)) { callBomb(); return; }   // every plane has made 4 passes and some are still alive: bomb the rest

      const rt = tg ? Math.hypot(tg._cx - C.x, tg._cy - C.y) : R, d = Math.max(130, rt - Math.random() * 16);       // line stays well clear of the Marines at the centre

      const ux = -Math.sin(phi) * sg, uy = Math.cos(phi) * sg, qx = C.x + Math.cos(phi) * d, qy = C.y + Math.sin(phi) * d;

      let ang = Math.atan2(uy, ux) * 180 / Math.PI; const fl = ux < 0; if (fl) ang += 180;
      const p = document.createElement("div"); p.className = "plane";
      p.innerHTML = '<div class="ff' + (fl ? " flip" : "") + '">' + a10SVG() + '</div>';
      p.style.transformOrigin = "60px 22px"; scene.appendChild(p);
      const t0 = performance.now(), DUR = 3200, ALT = 52; let lastShot = 0;
