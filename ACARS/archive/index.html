<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#050805">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ACARS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>312th Airlift ACARS Archive v7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050805;--glow:#39ff7a;--dim:#1d8f47;--line:#12361f;--paper:#f6f4ee;--ink:#17131a;--warn:#ffb347}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--glow);font:15px/1.5 "B612 Mono","IBM Plex Mono","Courier New",monospace}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.top{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font:700 clamp(16px,4.6vw,22px)/1.1 "B612 Mono",monospace;margin:0;letter-spacing:.04em;flex:1 1 220px}
h1 small{display:block;font-weight:400;font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.08em}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{background:#0b140d;color:var(--glow);border:1px solid var(--dim);border-radius:4px;padding:8px 10px;font:inherit;font-size:14px;min-width:0;width:200px}
input[type=search]::placeholder{color:#1d8f47aa}
.seg{display:inline-flex;border:1px solid var(--dim);border-radius:4px;overflow:hidden}
.seg button{background:transparent;color:var(--dim);border:0;padding:8px 11px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--glow);color:#021008;font-weight:700}
.seg button:focus-visible,input:focus-visible,select:focus-visible,.more:focus-visible,.abtn:focus-visible,summary:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
main{max-width:1200px;margin:0 auto;padding:16px}
.count{color:var(--dim);font-size:12px;margin:0 0 12px;letter-spacing:.06em}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;align-items:start}
.slip{background:var(--paper);color:var(--ink);font:13px/1.35 "IBM Plex Mono","Courier New",monospace;padding:14px 14px 12px;border-radius:2px;box-shadow:0 2px 0 #000,0 0 0 1px #0004;position:relative}
.slip::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:linear-gradient(-45deg,transparent 4px,var(--paper) 0) 0 0/10px 6px,linear-gradient(45deg,transparent 4px,var(--paper) 0) 0 0/10px 6px;opacity:.0}
.slip .meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#6b6470;border-bottom:1px dashed #b9b4bd;padding-bottom:6px;margin-bottom:8px}
.slip .ln{white-space:pre-wrap;word-break:break-word;min-height:1.35em}
.slip .ln.to{font-weight:600;font-size:15px}
.slip .ln.small{text-align:center;font-size:11px;color:#6b6470}
.slip .ln.head{font-weight:600}
.slip img{display:block;width:100%;height:auto;image-rendering:pixelated;background:#fff}
.slip .foot{margin-top:8px;font-size:11px;color:#6b6470;display:flex;justify-content:space-between}
.empty,.err{border:1px solid var(--dim);padding:16px;border-radius:4px;max-width:640px}
.err{border-color:var(--warn);color:var(--warn)}
.more{display:block;margin:22px auto 8px;background:transparent;color:var(--glow);border:1px solid var(--glow);padding:11px 22px;font:700 14px "B612 Mono",monospace;cursor:pointer;border-radius:4px}
.more[hidden]{display:none}
.more:hover{background:var(--glow);color:#021008}
footer{max-width:1200px;margin:24px auto 40px;padding:0 16px;color:var(--dim);font-size:12px;line-height:1.7}
footer b{color:var(--glow);font-weight:700}
a{color:var(--glow)}

/* ---- Alerts panel ---- */
.alerts{border:1px solid var(--dim);border-radius:4px;margin:0 0 16px;max-width:640px;background:#08110a}
.alerts summary{cursor:pointer;padding:10px 12px;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.alerts summary::-webkit-details-marker{display:none}
.alerts summary .st{font-weight:400;font-size:12px;color:var(--dim)}
.alerts summary .st.on{color:var(--glow)}
.abody{padding:4px 12px 14px;border-top:1px solid var(--line)}
.abtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.abtn{background:transparent;color:var(--glow);border:1px solid var(--glow);padding:9px 14px;font:700 13px "B612 Mono",monospace;cursor:pointer;border-radius:4px}
.abtn.primary{background:var(--glow);color:#021008}
.abtn:hover{background:var(--glow);color:#021008}
.abtn[hidden]{display:none}
.amsg{margin:12px 0 0;font-size:12px;color:var(--dim);line-height:1.6;min-height:1.6em}
.amsg.ok{color:var(--glow)}
.amsg.bad{color:var(--warn)}
@media (max-width:520px){input[type=search]{width:100%}.tools{width:100%}}
/* phones: three slips across */
@media (max-width:600px){
  main{padding:10px 8px}
  #grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .slip{font-size:9px;line-height:1.3;padding:7px 6px 6px}
  .slip .meta{flex-wrap:wrap;gap:0 4px;font-size:8px;padding-bottom:4px;margin-bottom:5px}
  .slip .ln{min-height:1.3em}
  .slip .ln.to{font-size:10px}
  .slip .ln.small{font-size:8px}
  .slip .foot{font-size:8px;margin-top:5px;flex-wrap:wrap}
  .alerts{max-width:none}
}
@supports (padding:max(0px)){header{padding-top:max(12px,env(safe-area-inset-top))}footer{padding-bottom:env(safe-area-inset-bottom)}}
</style>
</head>
<body>
<header><div class="top">
  <h1>ARCHIVE<small>312TH AIRLIFT ACARS · EVERY PRINT, KEPT · v7</small></h1>
  <div class="tools">
    <input id="q" type="search" placeholder="Search prints" aria-label="Search prints" autocomplete="off">
    <span class="seg" role="group" aria-label="Show"><button data-k="" aria-pressed="true">All</button><button data-k="text" aria-pressed="false">Text</button><button data-k="photo" aria-pressed="false">Pictures</button></span>
    <span class="seg" role="group" aria-label="Order"><button data-o="new" aria-pressed="true">Newest</button><button data-o="old" aria-pressed="false">Oldest</button></span>
  </div>
</div></header>
<main>
  <details class="alerts" id="appbadge">
    <summary><span>📲 Home-screen app &amp; icon badge</span><span class="st" id="pstate">...</span></summary>
    <div class="abody">
      <p class="amsg" id="pinfo"></p>
      <div class="abtns">
        <button type="button" class="abtn primary" id="pEnable" hidden>Turn on badge &amp; notifications</button>
        <button type="button" class="abtn" id="pTest" hidden>Send test</button>
        <button type="button" class="abtn" id="pDisable" hidden>Turn off</button>
      </div>
      <p class="amsg" id="pmsg" aria-live="polite"></p>
    </div>
  </details>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="grid"></div>
  <button class="more" id="more" hidden>Load more</button>
</main>
<footer id="foot"></footer>
<script>
/* The archive's Worker address. Set once after the Worker is deployed. */
const API = "https://acars-archive.cale-simmons.workers.dev";
const PAGE = 30;
let kind = "", order = "new", q = "", offset = 0, total = 0, busy = false, seq = 0, lastShownAt = null;
const $ = id => document.getElementById(id);
const grid = $("grid"), more = $("more"), count = $("count");

function fmt(at){
  const m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(at || ""); if (!m) return at || "";
  const d = new Date(+m[1], m[2]-1, +m[3], +m[4], +m[5]);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) + "  " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function slip(p){
  const a = document.createElement("article"); a.className = "slip";
  const meta = document.createElement("div"); meta.className = "meta";
  const l = document.createElement("span"); l.textContent = fmt(p.at);
  const r = document.createElement("span"); r.textContent = p.up ? "♥ " + p.up : "";
  meta.append(l, r); a.append(meta);
  if (p.photo) {
    const label = document.createElement("div"); label.className = "ln head"; label.textContent = p.to || "Picture"; a.append(label);
    const im = document.createElement("img"); im.loading = "lazy"; im.alt = (p.to || "Picture") + " print";
    im.src = API + "/image/" + encodeURIComponent(p.photo);
    im.onerror = () => { im.replaceWith(Object.assign(document.createElement("div"), {className:"ln small", textContent:"(picture no longer available)"})); };
    a.append(im);
  } else if (p.lines && p.lines.length) {
    p.lines.forEach(x => { const d = document.createElement("div"); d.className = "ln " + (x.s === "to" ? "to" : x.s === "small" ? "small" : x.s === "head" ? "head" : ""); d.textContent = x.s === "to" ? "TO: " + x.t : x.t; a.append(d); });
  } else {
    const d = document.createElement("div"); d.className = "ln"; d.textContent = (p.to ? "TO: " + p.to + "\n" : "") + (p.msg || ""); a.append(d);
  }
  if (p.from && !p.photo) { const f = document.createElement("div"); f.className = "foot"; f.textContent = "FROM: " + p.from; a.append(f); }
  return a;
}
function problem(msg){ count.textContent = ""; grid.replaceChildren(Object.assign(document.createElement("div"), {className:"err", textContent: msg})); more.hidden = true; }

async function load(reset){
  if (API.includes("WORKERS_SUBDOMAIN")) { problem("The archive isn't connected yet. The site owner still needs to set the archive address."); return; }
  if (busy) return; busy = true; const my = ++seq;
  if (reset) { offset = 0; grid.replaceChildren(); count.textContent = "Loading…"; more.hidden = true; }
  try {
    const u = new URL(API + "/prints"); u.searchParams.set("limit", PAGE); u.searchParams.set("offset", offset); u.searchParams.set("order", order);
    if (kind) u.searchParams.set("kind", kind); if (q) u.searchParams.set("q", q);
    const r = await fetch(u); if (!r.ok) throw new Error(r.status);
    const d = await r.json(); if (my !== seq) return;
    total = d.total; d.prints.forEach(p => grid.append(slip(p))); offset += d.prints.length;
    if (reset && order === "new" && !q && !kind && d.prints[0]) lastShownAt = d.prints[0].at;
    count.textContent = total ? "Showing " + offset + " of " + total : "";
    if (!total) grid.replaceChildren(Object.assign(document.createElement("div"), {className:"empty", textContent: q ? "Nothing matches that search." : "No prints copied yet. They show up a few minutes after the first sync."}));
    more.hidden = offset >= total;
    if (reset && window.onGridShown) window.onGridShown();
  } catch (e) { if (my === seq) problem("Couldn't load the archive right now. Try again in a minute."); }
  busy = false;
}
async function status(){
  if (API.includes("WORKERS_SUBDOMAIN")) return;
  try {
    const s = await (await fetch(API + "/status")).json();
    const ago = s.last_sync ? Math.max(0, Math.round((Date.now() - Date.parse(s.last_sync)) / 60000)) : null;
    $("foot").innerHTML = "";
    const line = document.createElement("div");
    line.textContent = s.prints + " prints and " + s.images + " pictures kept (" + s.image_mb + " MB of 500 MB). " +
      (ago === null ? "Not synced yet." : "Last copied from the printer " + (ago < 1 ? "just now" : ago + " min ago") + ".") +
      (s.history_complete ? "" : " Still copying older history.") + (s.last_error ? " Last problem: " + s.last_error : "");
    $("foot").append(line);
  } catch (_) {}
}
document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { kind = b.dataset.k; document.querySelectorAll("[data-k]").forEach(x => x.setAttribute("aria-pressed", x === b)); load(true); });
document.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { order = b.dataset.o; document.querySelectorAll("[data-o]").forEach(x => x.setAttribute("aria-pressed", x === b)); load(true); });
let t; $("q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { q = e.target.value.trim(); load(true); }, 300); });
more.onclick = () => load(false);
load(true); status();

/* =====================================================================
   v7: installable app + number on the home-screen icon
   - Add to Home Screen makes this a standalone app (manifest.webmanifest + sw.js).
   - When a new print lands, the archive Worker sends a push. The service worker
     counts the prints you haven't seen, shows a notification and sets the icon badge.
   - Opening the app marks everything seen and clears the badge.
   ===================================================================== */
const VAPID_PUBLIC = "BFCBEE_fYFkq3qo81S1L7cu-Vd1pnvfM5I4E0jQcxuQfMAXWn4wF2W2H181Qlc1PEF7fgV59NSjK80V3T7V_Uow";
const STATE_CACHE = "arch-state-v1";   /* not "acars-": the main ACARS app deletes caches with that prefix */
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let swReg = null;

async function stSet(k, v){ try { await (await caches.open(STATE_CACHE)).put("/__state/" + k, new Response(JSON.stringify(v))); } catch (_) {} }
function urlB64(s){ const b = (s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"); return Uint8Array.from(atob(b), c => c.charCodeAt(0)); }
function pMsg(text, cls){ const m = $("pmsg"); m.textContent = text || ""; m.className = "amsg" + (cls ? " " + cls : ""); }

async function markSeen(){
  let at = lastShownAt;
  if (!at) { try { const d = await (await fetch(API + "/prints?limit=1&order=new", {cache: "no-store"})).json(); at = d.prints && d.prints[0] && d.prints[0].at; } catch (_) {} }
  if (at) await stSet("lastSeen", {at});
  try { if (navigator.clearAppBadge) await navigator.clearAppBadge(); } catch (_) {}
  try { if (swReg) (await swReg.getNotifications()).forEach(n => n.close()); } catch (_) {}
}
window.onGridShown = () => { if (!document.hidden) markSeen(); };

async function pRender(){
  const st = $("pstate"), info = $("pinfo"), en = $("pEnable"), ds = $("pDisable"), ts = $("pTest");
  en.hidden = ds.hidden = ts.hidden = true;
  const supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  if (!supported) {
    st.textContent = "INSTALL"; st.className = "st";
    info.textContent = isIOS
      ? "To get a number on the icon: open this page in Safari, tap the Share button, choose Add to Home Screen, then open ACARS from your Home Screen and come back to this panel. Needs iOS 16.4 or newer."
      : "This browser can't do push notifications. On iPhone, add this page to your Home Screen first.";
    return;
  }
  if (Notification.permission === "denied") {
    st.textContent = "BLOCKED"; st.className = "st";
    info.textContent = "Notifications are blocked for this app. On iPhone: Settings > Notifications > ACARS > Allow Notifications, then come back.";
    return;
  }
  let sub = null; try { const reg = swReg || await navigator.serviceWorker.getRegistration(); sub = reg && await reg.pushManager.getSubscription(); } catch (_) {}
  if (sub && Notification.permission === "granted") {
    st.textContent = "ON"; st.className = "st on";
    info.textContent = "On. When a new print lands you get a notification, and the icon shows how many prints arrived since you last opened the app.";
    ds.hidden = ts.hidden = false;
  } else {
    st.textContent = "OFF"; st.className = "st";
    info.textContent = "Get a notification and a number on the app icon whenever a new print lands. This works with the app closed.";
    en.hidden = false;
  }
}

$("pEnable").onclick = async () => {
  pMsg("Asking...");
  try {
    const perm = await Notification.requestPermission();       /* must be the first thing after the tap */
    if (perm !== "granted") { pMsg("Permission wasn't granted.", "bad"); pRender(); return; }
    const reg = await navigator.serviceWorker.ready; swReg = reg;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: urlB64(VAPID_PUBLIC)});
    const r = await fetch(API + "/push/subscribe", {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify({endpoint: sub.endpoint})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) throw new Error(j.error || ("HTTP " + r.status));
    await markSeen();
    pMsg("Turned on. Tap Send test to check it.", "ok");
  } catch (e) { pMsg("Couldn't turn it on: " + e.message, "bad"); }
  pRender();
};
$("pTest").onclick = async () => {
  pMsg("Sending test...");
  try {
    const reg = swReg || await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription(); if (!sub) throw new Error("not subscribed");
    const r = await fetch(API + "/push/test", {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify({endpoint: sub.endpoint})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) throw new Error(j.error || ("HTTP " + r.status));
    pMsg("Test sent. A notification should show up in a few seconds.", "ok");
  } catch (e) { pMsg("Test failed: " + e.message, "bad"); }
};
$("pDisable").onclick = async () => {
  try {
    const reg = swReg || await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await fetch(API + "/push/unsubscribe", {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify({endpoint: sub.endpoint})}).catch(() => {});
      await sub.unsubscribe();
    }
    try { if (navigator.clearAppBadge) await navigator.clearAppBadge(); } catch (_) {}
    pMsg("Turned off.");
  } catch (e) { pMsg("Couldn't turn it off: " + e.message, "bad"); }
  pRender();
};

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(r => { swReg = r; pRender(); }).catch(() => pRender());
  navigator.serviceWorker.addEventListener("message", e => { if (e.data === "push" && !document.hidden) load(true).then(status); });
} else pRender();
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (Date.now() - hiddenAt > 30000) { load(true); status(); } else markSeen();   /* short trips away keep your scroll position */
});
pRender();
</script>
</body>
</html>
